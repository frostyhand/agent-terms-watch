# Weekly re-check of every shop's terms and robots.txt from a US network. Commits only coded
# results and a change log; full terms text stays in a short-lived artifact.
name: Weekly terms watch

on:
  schedule:
    - cron: "0 15 * * 1"   # Mondays 15:00 UTC
  workflow_dispatch:
    inputs:
      backfill:
        description: "YYYYMMDD to also fetch year-ago archive copies (first run only)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch shard
        env:
          BACKFILL: ${{ github.event.inputs.backfill }}
        run: |
          args=""
          if [[ "$BACKFILL" =~ ^[0-9]{8}$ ]]; then args="--backfill $BACKFILL"; fi
          python study/fetch.py --panel data/panel.csv --out results/weekly --shard ${{ matrix.shard }}/4 $args
          python study/retry_archive.py results/weekly $args
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: results/weekly/
          retention-days: 30

  code-and-commit:
    needs: fetch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
      - name: Merge shards
        run: |
          mkdir -p results/weekly/{robots,terms,robots_then,terms_then}
          for d in shards/*; do
            cat "$d/sites.jsonl" >> results/weekly/sites.jsonl
            for s in robots terms robots_then terms_then; do cp -r "$d/$s/." "results/weekly/$s/" 2>/dev/null || true; done
          done
      - name: Code, summarise, diff
        run: |
          python study/classify.py results/weekly
          day=$(date -u +%F)
          mkdir -p data/runs changes
          python study/summarise.py results/weekly data/hand-check.csv > "data/runs/$day-summary.md"
          cp results/weekly/classified.csv "data/runs/$day-classified.csv"
          python study/diff.py results/weekly data/state.json "changes/$day.md"
          python study/render_page.py results/weekly data/hand-check.csv docs/index.html
      - name: Commit coded results
        run: |
          git config user.name "agent-terms-watch"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json data/runs changes docs
          git diff --cached --quiet || git commit -m "weekly run $(date -u +%F)"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: full-text
          path: results/weekly/
          retention-days: 30
